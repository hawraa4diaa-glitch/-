<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطولة التفاعلية الكبرى 🎡</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-cozy: #f4f7f6;
            --card-pure: #ffffff;
            --team1-color: #3182ce;
            --team2-color: #dd6b20;
            --mint-green: #38a169;
            --crimson: #e53e3e;
            --gold: #d69e2e;
            --text-dark: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-cozy);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 850px;
            background: var(--card-pure);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            position: relative;
            text-align: center;
        }

        /* لوحة النقاط */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #edf2f7;
            padding: 15px;
            border-radius: 20px;
        }

        .team-display {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            background: #fff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
        }

        .team-1 { color: var(--team1-color); }
        .team-2 { color: var(--team2-color); }

        .team-display.active-turn {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: currentColor;
        }

        .score-num {
            font-size: 3rem;
            font-weight: 900;
        }

        /* عجلة الحظ */
        .wheel-container {
            margin: 20px 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-graphic {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 8px solid #cbd5e0;
            background: conic-gradient(
                var(--team1-color) 0deg 90deg, 
                var(--gold) 90deg 180deg, 
                var(--team2-color) 180deg 270deg, 
                var(--mint-green) 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .wheel-pointer {
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #2d3748;
            position: absolute;
            top: -10px;
            z-index: 10;
        }

        .event-badge {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 8px 25px;
            background: #e2e8f0;
            border-radius: 50px;
            display: inline-block;
        }

        /* المؤقت */
        .timer-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            opacity: 0.2; 
            transition: opacity 0.3s;
        }

        .countdown-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #cbd5e0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 900;
            color: var(--mint-green);
            background: #ffffff;
            transition: all 0.2s;
        }

        .countdown-circle.danger {
            color: var(--crimson);
            border-color: var(--crimson);
            animation: flash 0.4s infinite alternate;
        }

        @keyframes flash {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.05); opacity: 0.9; }
        }

        /* ساحة العرض والأسئلة */
        .arena-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 30px;
            margin-top: 15px;
            opacity: 0.4; 
            pointer-events: none; 
            transition: all 0.4s ease;
        }

        .arena-card.active-quiz {
            opacity: 1;
            pointer-events: auto;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .options-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-layout { grid-template-columns: 1fr; }
        }

        .opt-btn {
            background: var(--card-pure);
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: right;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .opt-btn:hover:not([disabled]) {
            transform: scale(1.02);
            border-color: #cbd5e0;
            background: #f7fafc;
        }

        .opt-btn.correct-glow {
            background-color: var(--mint-green) !important;
            color: #fff !important;
            border-color: var(--mint-green);
            box-shadow: 0 0 15px rgba(56, 161, 105, 0.4);
        }

        .opt-btn.wrong-glow {
            background-color: var(--crimson) !important;
            color: #fff !important;
            border-color: var(--crimson);
            box-shadow: 0 0 15px rgba(229, 62, 62, 0.4);
        }

        /* أزرار التحكم السفلية */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .master-btn {
            background: var(--text-dark);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .master-btn:hover:not([disabled]) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .master-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .spin-action-btn {
            background: linear-gradient(135deg, var(--team1-color), #4c51bf);
            background-color: var(--team1-color);
            color: white;
            box-shadow: 0 5px 15px rgba(49, 130, 206, 0.4);
        }

        .end-celebration {
            display: none;
            padding: 40px 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="scoreboard">
        <div class="team-display team-1 active-turn" id="box-T1">
            <div style="font-size: 1.2rem; font-weight: bold;">الفريق الأول 🚀</div>
            <div class="score-num" id="score-1">0</div>
        </div>
        <div style="font-size: 1.5rem; font-weight: bold; color: #a0aec0; margin: 0 15px;">ضد</div>
        <div class="team-display team-2" id="box-T2">
            <div style="font-size: 1.2rem; font-weight: bold;">الفريق الثاني 🔥</div>
            <div class="score-num" id="score-2">0</div>
        </div>
    </div>

    <div class="wheel-container" id="wheel-zone">
        <div class="wheel-pointer"></div>
        <div class="wheel-graphic" id="lucky-wheel"></div>
        <div class="event-badge" id="event-tag">اضغط على زر التدوير بالأسفل لبدء التحدي! 🎰</div>
    </div>

    <div class="timer-zone" id="timer-container">
        <div class="countdown-circle" id="timer-box">40</div>
    </div>

    <div id="quiz-arena">
        <div class="arena-card" id="quiz-card">
            <div class="question-text" id="target-q">السؤال مغلق.. قم بتدوير العجلة أولاً 🔒</div>
            <div class="options-layout" id="target-opts"></div>
        </div>
    </div>

    <div class="end-celebration" id="end-zone">
        <h1 style="font-size: 3rem; color: var(--mint-green);">🎉 انتهاء الملحمة اللغوية 🎉</h1>
        <div id="winner-banner" style="font-size: 1.8rem; margin: 25px 0; font-weight: bold;"></div>
        <button class="master-btn" onclick="location.reload()">جولة تحدي جديدة 🔄</button>
    </div>

    <div class="control-panel" id="panel-zone">
        <div id="round-counter" style="color: #718096; font-weight: bold; font-size: 1.1rem;">السؤال: 1 / 47</div>
        <button class="master-btn spin-action-btn" id="spin-btn" onclick="spinTheWheel()">دور العجلة الآن 🎡</button>
        <button class="master-btn" id="next-btn" onclick="nextRound()" style="display: none;">السؤال التالي ⭠</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    // مصفوفة الأسئلة - تم استكمالها إلى 47 سؤالاً بدقة
    const dataset = [
        { q: "القدرة على اكتشاف معاني المفردات الغريبة من سياقها في النص من أدوات قارئ النص:", opts: ["أ- المعرفة النحوية", "ب- المعرفة المعجمية", "جـ- المعرفة البلاغية"], a: 1 },
        { q: "الإيحاءات التالية: (الظلم والجبروت، ادعاء الألوهية، الغرق، بناء الأهرامات) تدل على المفردة:", opts: ["أ- الاستعمار", "ب- الظلم", "جـ- فرعون"], a: 2 },
        { q: "قال غازي القصيبي:\n«فيا لؤلؤتي السمراء ما أعجب ما يأتي به القدر»\nالفن البلاغي هنا هو:", opts: ["أ- الاستعارة", "ب- الكناية", "جـ- المجاز"], a: 0 },
        { q: "من خطوات القراءة وعمليتها تحليل البنية البلاغية للنص:", opts: ["أ- استطلاع النص", "ب- القراءة حول النص", "جـ- قراءة متأنية للتحليل والتقويم"], a: 2 },
        { q: "قال يحيى توفيق:\nالليل يضنيـني بطـول سكونه .. فأذيب باللذات ليل عناني\nحتى إذا لاح الصبـاح بنوره .. خاصمت لذاتي وطال بكائي\nيارب عفوك قد مللت فتوبة .. تمحو بها إن شئت كل شقائي\n\nعاطفة الشاعر هنا هي:", opts: ["أ- الندم والأمل بالمغفرة والتوبة", "ب- الشعور بالغربة بين الأهل", "جـ- الشوق والـلهفة"], a: 0 },
        { q: "ما معنى النهي في قول أبو العلاء المعري:\n«ولا تجلس إلى أهل الدنايا فإن خلائق السفهاء تعدي»", opts: ["أ- الإباحة", "ب- الأمر", "جـ- النصح والإرشاد"], a: 2 },
        { q: "«ولا وليت وجهاً عن الصلة، إلا بعد أن تثبت عطفاً إلى القطيعة»\nالفن البلاغي بين كلمة (الصلة) و(القطيعة) هو:", opts: ["أ- جناس", "ب- تضاد", "جـ- مجاز"], a: 1 },
        { q: "استخدام الحوار والصراع بين الشخصيات للتعبير عن أفكار الأديب ووجهة نظره صفة تُميّز:", opts: ["أ- مشتركة بين جميع الفنون", "ب- تميز القصة", "جـ- تميز المسرحية"], a: 2 },
        { q: "«ولا أبديت هجراً إلا بعد أن أبديت غدراً»\nهنا فن بلاغي هو:", opts: ["أ- الجناس", "ب- السجع", "جـ- التضاد"], a: 1 },
        { q: "قال الأمير عبدالله الفيصل:\nغربتي غربة المشاعر والروح .. إن عشت بين أهلي وصحبي\nأزرع الود والحنان وأسقي .. واحة الحب من روافد قلبي\n\nعواطف الشاعر هنا تعبر عن:", opts: ["أ- الندم والأمل بالمغفرة", "ب- الشوق والـلهفة والحزن", "جـ- الشعور بالغربة بين الأهل"], a: 2 },
        { q: "قال غازي القصيبي:\nماذا أرى زورقاً في اليم مندفعاً\nوقل\nهذه أغنيات الغوص في أذني\n\nالألفاظ في الأبيات تدل على:", opts: ["أ- البيئة الصحراوية", "ب- البيئة البحرية", "جـ- لاشيء مما سبق"], a: 1 },
        { q: "قال غازي القصيبي: «أنا الأشياء تحتضر...» هنا الكناية عن:", opts: ["أ- الشيخوخة", "ب- الشباب", "جـ- الطفولة"], a: 0 },
        { q: "وصف تفاصيل الأحداث كما وقعت في الحقيقة تكون في فن:", opts: ["أ- القصة", "ب- المذكرات الأدبية", "جـ- المسرحية"], a: 1 },
        { q: "الإيحاءات التالية: (التضحية، الفداء، البناء، الانتماء) تدل على مفردة:", opts: ["أ- الأم", "ب- مكة", "جـ- الوطنية"], a: 2 },
        { q: "القراءة الجهرية والصامتة السريعة ما يفعله القارئ في خطوة:", opts: ["أ- القراءة حول النص", "ب- استطلاع النص", "جـ- قراءة متأنية للتحليل والتقويم"], a: 1 },
        { q: "من أنواع الوصف الأدبي وصف الشخصية ويكون بـ:", opts: ["أ- التصوير الحسي للمرئيات والمسموعات", "ب- تصوير الشكل والهيأة والجانب النفسي", "جـ- وصف يجيب عن أسئلة متى، أين، لماذا؟"], a: 1 },
        { q: "أن تحلل أجزاء الموصوف الرئيسة إلى أجزاء فرعية من:", opts: ["أ- طرق الوصف", "ب- خطوات كتابة المذكرة", "جـ- خطوات كتابة الوصف"], a: 2 },
        { q: "الخطوة الثالثة من خطوات كتابة المذكرات الأدبية هي:", opts: ["أ- حدد المدة الزمنية التي ستتحدث عنها", "ب- استبعد الأحداث غير المهمة", "جـ- ابدأ بسرد الأحداث وتصوير المواقف"], a: 2 },
        { q: "ما يفعله أشخاص القصة أو يحدث لهم حسياً أو وجدانياً وغالباً تكون متخيلة أو معدلة من الواقع هي:", opts: ["أ- الأحداث", "ب- الزمان والمكان", "جـ- الفكرة"], a: 0 },
        { q: "الأحداث في المذكرات الأدبية دائماً تكون:", opts: ["أ- واقعية", "ب- خيالية", "جـ- لا شيء مما سبق"], a: 0 },
        { q: "القيمة الفنية لكتابة المذكرات الأدبية هي:", opts: ["أ- سجل للأحداث التي تعرض لها الكاتب", "ب- الاستفادة من التجارب والخبرات", "جـ- جميع ما سبق"], a: 2 },
        { q: "المحافظة على إيقاع (وزن) محدد ينتظم به النص جميعه صفة مشتركة بين جميع الفنون الأدبية.", opts: ["صح 👍", "خطأ 👎 (خاص بالشعر فقط)"], a: 1 },
        { q: "قال تعالى: «وَكُلُوا وَاشْرَبُوا حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ»\nمعنى الأمر هنا هو الإباحة.", opts: ["صح 👍", "خطأ 👎"], a: 0 },
        { q: "البطل في المذكرات الأدبية يكون شخصاً آخر غير الكاتب.", opts: ["صح 👍", "خطأ 👎 (البطل هو الكاتب نفسه)"], a: 1 },
        { q: "العناصر الفنية للوصف الأدبي هي الوصف الحسي والوصف الوجداني.", opts: ["صح 👍", "خطأ 👎"], a: 0 },
        { q: "الاهتمام بوصف الشخصيات والأمكنة والأحداث للتعبير عن الفكرة هي صفة مشتركة بين جميع الفنون الأدبية.", opts: ["صح 👍", "خطأ 👎 (ميزة للقصة والرواية وليست كالشعر)"], a: 1 },
        { q: "أي من التالي ممنوع من الصرف لسبب أنه علم يشبه الفعل؟", opts: ["أ- أحمد", "ب- أسماء", "جـ- إبراهيم"], a: 0 },
        { q: "علامة جر الممنوع من الصرف إذا لم يكن مضافاً ولا معرفاً بأل هي:", opts: ["أ- الكسرة", "ب- الياء", "جـ- الفتحة"], a: 2 },
        { q: "أي من الجمل التالية تحتوي مفعولاً مطلقاً؟", opts: ["أ- شرحت المسألة شرحاً وافياً", "ب- نقلت الصحيفة الخبر", "جـ- اجتهدت طلباً للنجاح"], a: 0 },
        { q: "في قوله تعالى: {إني رأيت أحد عشر كوكباً} ماذا يعرب الاسم كوكباً؟", opts: ["أ- حال", "ب- مفعول به", "جـ- تمييز"], a: 2 },
        { q: "عند إضافة المثنى أو جمع المذكر السالم مثل (معلمون + المدرسة) ماذا يحدث للنون؟", opts: ["أ- تبقى كما هي (معلمون المدرسة)", "ب- تحذف النون بسبب الإضافة (معلمو المدرسة)", "جـ- تقلب النون ميماً (معلموم المدرسة)"], a: 1 },
        { q: "سبب منع كلمة مساجد من الصرف لأنها:", opts: ["أ- صيغة منتهى الجموع", "ب- علم أعجمي", "جـ- آخره ألف ونون زائدتين"], a: 0 },
        { q: "استعمار همزتها همزة وصل بسبب أنها:", opts: ["أ- مصدر رباعي", "ب- ماضي سداسي", "جـ- مصدر سداسي"], a: 2 },
        { q: "المصدر من الفعل أعاد:", opts: ["أ- أعد", "ب- إعادة", "جـ- وعد"], a: 1 },
        { q: "نوع المتمم المنصوب في جملة حفظت القرآن ليلة العيد:", opts: ["أ- مفعول لأجله", "ب- مفعول مطلق", "جـ- مفعول فيه"], a: 2 },
        { q: "أكملي الجملة بالشكل الصحيح: كافأت الشركة ............", opts: ["أ- أبو العامل", "ب- أبا العامل", "جـ- أبي العامل"], a: 1 },
        { q: "(المضاف) في جملة كن عالماً أو طالب علم:", opts: ["أ- عالماً", "ب- علم", "جـ- طالب"], a: 2 },
        { q: "وصلت إلى ............ متأخراً:", opts: ["أ- المطارِ", "ب- المطارُ", "جـ- المطارَ"], a: 0 },
        { q: "هاجر النبي بصحبة ....... المضاف إليه المناسب هو:", opts: ["أ- أبا بكر", "ب- أبي بكر", "جـ- أبو بكر"], a: 1 },
        { q: "سبب منع حضرموت من الصرف أنها:", opts: ["أ- علم أعجمي", "ب- علم يشبه الفعل", "جـ- مركب تركيب مزجي"], a: 2 },
        { q: "وقف الحاضرون متفرجين، ما تحته خط هنا هو:", opts: ["أ- حال", "ب- تمييز", "جـ- مفعول به"], a: 0 },
        { q: "المفعول المطلق هو مصدر منصوب يذكر لتوكيد الفعل أو بيان نوعه أو عدده.", opts: ["صح 👍", "خطأ 👎"], a: 0 },
        { q: "كلمة (أخذ) تبدأ بهمزة وصل لأنها فعل ماضٍ ثلاثي.", opts: ["صح 👍", "خطأ 👎 (تبدأ بهمزة قطع)"], a: 1 },
        { q: "من الأسماء السماعية كلمة اثنان وهمزتها همزة وصل.", opts: ["صح 👍", "خطأ 👎"], a: 0 },
        { q: "الفعل المضارع من الأفعال الخمسة يرفع بـ:", opts: ["أ- الضمة الظاهرة", "ب- ثبوت النون", "جـ- واو الجماعة"], a: 1 },
        { q: "الاسم المستثنى بعد (إلا) في جملة: (حضر الطلاب إلا طالباً) حكمه النصب لأنه تام مثبت:", opts: ["صح 👍", "خطأ 👎"], a: 0 },
        { q: "أي من الكلمات التالية همزتها همزة قطع؟", opts: ["أ- ابن", "ب- اسم", "جـ- أحمد"], a: 2 }
    ];

    // متغيرات التحكم باللعبة
    let currentRound = 0;
    const totalRounds = dataset.length;
    let scores = [0, 0];
    let currentTeam = 1; 
    let currentDegrees = 0;
    let timerInterval = null;
    let timeLeft = 40; // تم تعديل وقت البداية الافتراضي ليكون 40
    let isAnswered = false;
    let roundPoints = 10; 

    document.getElementById('round-counter').innerText = `السؤال: 1 / ${totalRounds}`;

    function spinTheWheel() {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        document.getElementById('spin-btn').disabled = true;
        
        const extraDegrees = Math.floor(Math.random() * 360) + 1440; 
        currentDegrees += extraDegrees;
        const wheel = document.getElementById('lucky-wheel');
        wheel.style.transform = `rotate(${currentDegrees}deg)`;

        document.getElementById('event-tag').innerText = "جاري تدوير العجلة وتحديد النقاط... 🔄";

        const potentialPoints = [10, 20, 30, 40];
        roundPoints = potentialPoints[Math.floor(Math.random() * potentialPoints.length)];

        setTimeout(() => {
            document.getElementById('event-tag').innerText = `✨ هذا السؤال يعادل [ ${roundPoints} نقطة ]!  ✨`;
            activateQuiz();
        }, 3000);
    }

    function activateQuiz() {
        isAnswered = false;
        const card = document.getElementById('quiz-card');
        card.classList.add('active-quiz');
        
        const timerZone = document.getElementById('timer-container');
        timerZone.style.opacity = "1";

        const currentData = dataset[currentRound];
        document.getElementById('target-q').innerText = currentData.q;
        
        const optsContainer = document.getElementById('target-opts');
        optsContainer.innerHTML = '';

        currentData.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optsContainer.appendChild(btn);
        });

        // تشغيل المؤقت (تم التعديل إلى 40 ثانية)
        timeLeft = 40;
        const timerBox = document.getElementById('timer-box');
        timerBox.innerText = timeLeft;
        timerBox.classList.remove('danger');

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerBox.innerText = timeLeft;
            if (timeLeft <= 5) { // يبدأ الوميض بالأحمر في آخر 5 ثوانٍ
                timerBox.classList.add('danger');
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                lockOptionsDueToTimeout();
            }
        }, 1000);
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        if (isAnswered) return;
        isAnswered = true;
        clearInterval(timerInterval);

        const currentData = dataset[currentRound];
        const allButtons = document.querySelectorAll('.opt-btn');

        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentData.a) {
            selectedBtn.classList.add('correct-glow');
            playSfx('correct');
            scores[currentTeam - 1] += roundPoints; 
            document.getElementById(`score-${currentTeam}`).innerText = scores[currentTeam - 1];
        } else {
            selectedBtn.classList.add('wrong-glow');
            allButtons[currentData.a].classList.add('correct-glow'); 
            playSfx('wrong');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function lockOptionsDueToTimeout() {
        if (isAnswered) return;
        isAnswered = true;
        
        const currentData = dataset[currentRound];
        const allButtons = document.querySelectorAll('.opt-btn');

        allButtons.forEach(btn => btn.disabled = true);
        allButtons[currentData.a].classList.add('correct-glow'); 
        playSfx('wrong');

        document.getElementById('event-tag').innerText = "انتهى الوقت! ⏰";
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextRound() {
        currentRound++;
        
        document.getElementById('next-btn').style.display = 'none';

        const card = document.getElementById('quiz-card');
        card.classList.remove('active-quiz');
        document.getElementById('target-q').innerText = "السؤال مغلق.. قم بتدوير العجلة أولاً 🔒";
        document.getElementById('target-opts').innerHTML = '';
        document.getElementById('timer-container').style.opacity = "0.2";
        document.getElementById('timer-box').innerText = "40"; // تم التعديل إلى 40 هنا أيضاً
        document.getElementById('timer-box').classList.remove('danger');

        if (currentRound >= totalRounds) {
            endGame();
            return;
        }

        document.getElementById('round-counter').innerText = `السؤال: ${currentRound + 1} / ${totalRounds}`;

        currentTeam = currentTeam === 1 ? 2 : 1;
        document.getElementById('box-T1').classList.toggle('active-turn', currentTeam === 1);
        document.getElementById('box-T2').classList.toggle('active-turn', currentTeam === 2);

        document.getElementById('spin-btn').disabled = false;
        document.getElementById('event-tag').innerText = `دور الفريق ${currentTeam === 1 ? 'الأول' : 'الثاني'} لتدوير العجلة! 🎡`;
    }

    function endGame() {
        document.getElementById('wheel-zone').style.display = 'none';
        document.getElementById('timer-container').style.display = 'none';
        document.getElementById('quiz-arena').style.display = 'none';
        document.getElementById('panel-zone').style.display = 'none';

        const endZone = document.getElementById('end-zone');
        endZone.style.display = 'block';

        const banner = document.getElementById('winner-banner');
        if (scores[0] > scores[1]) {
            banner.innerHTML = `🏆 الفائز هو: <span style="color:var(--team1-color)">الفريق الأول</span> بـ ${scores[0]} نقطة!`;
            triggerConfetti();
        } else if (scores[1] > scores[0]) {
            banner.innerHTML = `🏆 الفائز هو: <span style="color:var(--team2-color)">الفريق الثاني</span> بـ ${scores[1]} نقطة!`;
            triggerConfetti();
        } else {
            banner.innerHTML = `🤝 تعادل رائع بين الفريقين بـ ${scores[0]} نقطة لكل منهما!`;
        }
    }

    function triggerConfetti() {
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
